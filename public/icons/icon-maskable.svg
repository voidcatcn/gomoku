<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="paperM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5ea" />
      <stop offset="1" stop-color="#e7d9c2" />
    </linearGradient>
    <radialGradient id="blackStoneM" cx="34%" cy="28%" r="82%">
      <stop offset="0" stop-color="#5a544b" />
      <stop offset="44%" stop-color="#201d18" />
      <stop offset="100%" stop-color="#060504" />
    </radialGradient>
    <radialGradient id="redStoneM" cx="34%" cy="28%" r="82%">
      <stop offset="0" stop-color="#e08a6f" />
      <stop offset="46%" stop-color="#b4432c" />
      <stop offset="100%" stop-color="#7d2818" />
    </radialGradient>
    <filter id="stoneShadowM" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#22170b" flood-opacity="0.36" />
    </filter>
    <filter id="grainM">
